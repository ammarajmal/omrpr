services:
  ros1-noetic:
    build:
      context: .
      dockerfile: Dockerfile.ros1-noetic
    image: omrpr/ros1-noetic:fin-phd
    container_name: omrpr_fin_ros1_noetic
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/workspace/omrpr_fin
      - ../../omrpr_private_data:/workspace/omrpr_private_data
      - ../ros_ws:/catkin_ws
      - /dev:/dev
    stdin_open: true
    tty: true
